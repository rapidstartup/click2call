[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."recordings-copier"]
  schedule = "*/5 * * * *"

[functions."recordings-retention"]
  schedule = "0 3 * * *"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173
  functionsPort = 8888

# HighLevel (LeadConnector) OAuth + webhook redirect URIs are registered with
# fixed nested paths in HighLevel's marketplace app config, so they need
# explicit rules ahead of the generic /api/* catch-all below.
[[redirects]]
  from = "/api/lc/oauth"
  to = "/.netlify/functions/lc-oauth"
  status = 200
  force = true

[[redirects]]
  from = "/api/lc/webhooks"
  to = "/.netlify/functions/lc-webhooks"
  status = 200
  force = true

# API redirects must come before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA catch-all must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"

[build.environment]
  NODE_VERSION = "24"
