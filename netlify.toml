[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."recordings-copier"]
  schedule = "*/5 * * * *"

[functions."recordings-retention"]
  schedule = "0 3 * * *"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173
  functionsPort = 8888

# API redirects must come before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA catch-all must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"

[build.environment]
  NODE_VERSION = "24"
